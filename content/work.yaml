headline: Senior Data Engineer & Product Owner · Lisbon
summary: >-
  I'm a senior data engineer and technical lead with 5+ years delivering
  cloud-native data pipelines in regulated banking and the automotive industry.
  At Critical TechWorks (BMW Group) I helped grow our product from one team to
  three, led technical hiring, and now own its roadmap as Product Owner. Outside
  work I keep building: an AI-native cultural events platform, a self-hosted
  home server, and this site.
