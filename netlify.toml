# Netlify build settings. Netlify's Next.js adapter is applied automatically, so API
# routes, image optimisation and the files in next.config.ts's outputFileTracingIncludes
# (data/photos.db, content/) work without a plugin entry here.
[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's default Bun (1.3.x) ignores better-sqlite3's "gypfile": false and tries to
  # compile it with node-gyp, which the build image lacks. Bun 1.4+ uses the prebuilt binary.
  BUN_VERSION = "1.4.4"
